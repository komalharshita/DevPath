<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bad Request — DevPath</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="{{ fit_meta_description('DevPath could not understand that request. Check the submitted information, return to the homepage, and explore project ideas, roadmaps, and starter code.') }}" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Bad Request — DevPath" />
  <meta property="og:description" content="{{ fit_meta_description('DevPath could not understand that request. Check the submitted information, return to the homepage, and explore project ideas, roadmaps, and starter code.') }}" />
  <meta property="og:image" content="{{ config.get_og_image_url() }}" />
  <meta property="og:url" content="{{ config.get_base_url() }}/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span>Dev</span><span class="nav-logo-accent">Path</span></a>
      {% include 'partials/theme_toggle.html' %}
    </div>
  </nav>
  <div class="error-page">
    <div class="error-page-inner">
      <div class="error-code">400</div>
      <h1>Bad Request</h1>
      <p>The request could not be understood by the server. Please check your input and try again.</p>
      {% if reference %}
      <p class="error-reference">Reference: <code>{{ reference }}</code></p>
      {% endif %}
      <a href="/" class="btn-primary" style="display:inline-block;text-decoration:none;padding:14px 32px;">Back to Home</a>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
