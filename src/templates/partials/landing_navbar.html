    <button class="landing-menu-toggle" type="button" aria-expanded="false" aria-controls="landing-navigation" aria-label="Open navigation menu">

    <div class="landing-nav-links" id="landing-navigation">

<script>
  const landingMenuToggle = document.querySelector('.landing-menu-toggle');
  const landingNavigation = document.getElementById('landing-navigation');
  landingMenuToggle?.addEventListener('click', () => {
    const isExpanded = landingMenuToggle.getAttribute('aria-expanded') === 'true';
    landingMenuToggle.setAttribute('aria-expanded', String(!isExpanded));
    landingMenuToggle.setAttribute('aria-label', isExpanded ? 'Open navigation menu' : 'Close navigation menu');
    landingNavigation?.classList.toggle('is-open', !isExpanded);
  });
</script>
