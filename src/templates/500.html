<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal Server Error — DevPath</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="{{ fit_meta_description('DevPath ran into a temporary server problem. Try again shortly or return to explore coding projects, guided roadmaps, and developer learning resources.') }}" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Internal Server Error — DevPath" />
  <meta property="og:description" content="{{ fit_meta_description('DevPath ran into a temporary server problem. Try again shortly or return to explore coding projects, guided roadmaps, and developer learning resources.') }}" />
  <meta property="og:image" content="{{ config.get_og_image_url() }}" />
  <meta property="og:url" content="{{ config.get_base_url() }}/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  {% include 'partials/theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span>Dev</span><span class="nav-logo-accent">Path</span></a>
      {% include 'partials/theme_toggle.html' %}
    </div>
  </nav>
  <div class="error-page">
    <div class="error-page-inner">
      <div class="error-code">500</div>
      <h1>Internal Server Error</h1>
      <p>Something went wrong on our side. Please try again in a moment.</p>
      <a href="/" class="btn-primary" style="display:inline-block;text-decoration:none;padding:14px 32px;">Back to Home</a>
    </div>
  </div>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
