{% extends "base.html" %}

{% block title %}Contact — DevPath{% endblock %}

{% block content %}
<section class="py-16">
    <div class="container max-w-3xl mx-auto">
        <div class="card">
            <div class="card__header text-center">
                <h1 class="text-3xl font-display font-bold">Contact Us</h1>
                <p class="text-muted">Have a question or feedback? We'd love to hear from you.</p>
            </div>
            <div class="card__body">
                <form action="https://api.web3forms.com/submit" method="POST" id="contact-form" class="contact-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" class="form-input" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary btn--lg" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
