backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "routes/**"
          - "utils/**"
          - "app.py"
          - "wsgi.py"
          - "config.py"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "templates/**"
          - "static/**"
          - "src/templates/**"
          - "src/static/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "CONTRIBUTING.md"
          - "CODE_OF_CONDUCT.md"
          - "SECURITY.md"
          - "CHANGELOG.md"
          - "docs/**"
          - "**/*.md"

data:
  - changed-files:
      - any-glob-to-any-file:
          - "data/**"

database:
  - changed-files:
      - any-glob-to-any-file:
          - "migrations/**"
          - "src/models.py"
          - "src/database/**"

type:testing:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "test_*.py"

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Dockerfile"
          - "docker-compose.yml"
          - "requirements*.txt"
          - "Makefile"
          - "vercel.json"