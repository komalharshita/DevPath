name: Issue Management

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  manage-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Triage and Label New Issue
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.issue.number;
            const creator = context.payload.issue.user?.login;

            // 1. Assign the issue creator
            if (creator) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [creator]
                });
              } catch (err) {
                console.warn(`Could not auto-assign creator @${creator}:`, err.message);
              }
            }

            // 2. Ensure default program label is attached
            // (Category labels like bug, feature, data, documentation are attached via issue templates)
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["gssoc-2026"]
              });
            } catch (err) {
              console.warn(`Could not add program label to #${issueNumber}:`, err.message);
            }
